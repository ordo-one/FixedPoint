name: Swift code coverage

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, next ]
jobs:
  test-code-coverage:
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - name: Install deps
      run: |
        apt-get update -q && apt-get install -y -q libjemalloc-dev curl

    - name: Swift version
      run: swift --version

    - name: Start consul
      uses: ./.github/actions/consul-start

    - name: Run tests
      continue-on-error: true
      run: |
        # The native build system keeps the single <Package>PackageTests.xctest executable that the export
        # step reads; the Swift Build backend, the default since 6.4, emits per-target runner and .so files.
        [ -d Tests ] && swift test --parallel --enable-code-coverage --build-system native

    - name: Export code coverage
      run: |
         # The executable carries the package name, not the repository name.
         xctest_binary=$(find .build/debug/ -maxdepth 1 -type f -name "*PackageTests.xctest" | head -1)
         if [ -z "${xctest_binary}" ]; then
             xctest_binary=$(find .build/debug/ -type f -name "*.xctest" | tail -1)
         fi
         if [ -z "${xctest_binary}" ]; then
             echo "No test executable found under .build/debug:"
             ls -la .build/debug/
             exit 1
         fi
         echo "Will llvm-cov '${xctest_binary}'"
         llvm-cov export -format="lcov" "${xctest_binary}" -instr-profile .build/debug/codecov/default.profdata > info.lcov

    - name: Upload codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_REPO_TOKEN }}
        files: info.lcov
        fail_ci_if_error: true
